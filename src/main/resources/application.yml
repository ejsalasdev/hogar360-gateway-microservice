server:
  port: 8080

# Configuración de SpringDoc OpenAPI con múltiples microservicios
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Gateway Microservice
        url: /v3/api-docs
      - name: Property Microservice
        url: /v3/api-docs/property
      - name: User Microservice
        url: /v3/api-docs/user
      - name: Visit Microservice
        url: /v3/api-docs/visit
  api-docs:
    path: /v3/api-docs

spring:
  application:
    name: gateway-microservice
  cloud:
    gateway:
      # Configuración global de CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      
      # Configuración de rutas a los microservicios
      routes:        # ===== PROPERTY MICROSERVICE (Puerto 8081) =====
        
        # Rutas de House (Propiedades)
        - id: house-create
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/house/create
            - Method=POST
        
        - id: house-list
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/house/read
            - Method=GET
        
        - id: house-by-id
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/house/read/**
            - Method=GET
        
        # Rutas de Categories (Categorías)
        - id: category-create
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/category/create
            - Method=POST
        
        - id: category-list
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/category/read
            - Method=GET
        
        - id: category-delete
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/category/**
            - Method=DELETE
        
        # Rutas de Ubications (Ubicaciones)
        - id: ubication-create
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/ubication/create
            - Method=POST
        
        - id: ubication-list
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/ubication/read
            - Method=GET
        
        # Rutas de Departments y Cities
        - id: departments-list
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/departments
            - Method=GET
        
        - id: cities-by-department
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/cities/departments/**
            - Method=GET
                 # ===== USER MICROSERVICE (Puerto 8082) =====
        
        - id: user-auth-login
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/login
            - Method=POST
        
        - id: user-create
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/user/create
            - Method=POST
        
        # ===== VISIT MICROSERVICE (Puerto 8083) =====
        
        - id: appointmentslot-create
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/appointmentslot/create
            - Method=POST
        
        - id: appointmentslot-read
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/appointmentslot/read
            - Method=GET
        
        - id: visit-create
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/visit/create
            - Method=POST

        # ===== RUTAS GENERALES PARA MICROSERVICIOS =====
        
        # Property microservice - todas las rutas que empiecen con /property
        - id: property-service
          uri: http://localhost:8081
          predicates:
            - Path=/property/**
          filters:
            - StripPrefix=1
        
        # User microservice - todas las rutas que empiecen con /user  
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        
        # Visit microservice - todas las rutas que empiecen con /visit
        - id: visit-service
          uri: http://localhost:8083
          predicates:
            - Path=/visit/**
          filters:
            - StripPrefix=1

# Configuración de logging para debugging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

# Configuración de gestión para health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

