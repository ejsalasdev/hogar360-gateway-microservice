server:
  port: ${SERVER_PORT:8080}

# Configuración de microservicios por entorno
microservices:
  property:
    url: ${PROPERTY_SERVICE_URL:http://localhost:8081}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  visit:
    url: ${VISIT_SERVICE_URL:http://localhost:8083}
  gateway:
    url: ${GATEWAY_SERVICE_URL:http://localhost:8080}

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs/property
        name: Property Service
      - url: /v3/api-docs/user
        name: User Service
      - url: /v3/api-docs/visit
        name: Visit Service

spring:
  application:
    name: gateway-microservice
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://app.hogar360.site"
              - "http://localhost:4200"
              - "https://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      routes:
        - id: house-create
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/house/create
            - Method=POST
        
        - id: house-list
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/house/read
            - Method=GET
        
        - id: house-by-id
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/house/read/**
            - Method=GET
        
        - id: category-create
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/category/create
            - Method=POST
        
        - id: category-list
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/category/read
            - Method=GET
        
        - id: category-delete
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/category/**
            - Method=DELETE
        
        - id: ubication-create
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/ubication/create
            - Method=POST
        
        - id: ubication-list
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/ubication/read
            - Method=GET
        
        - id: departments-list
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/departments
            - Method=GET
        
        - id: cities-by-department
          uri: ${microservices.property.url}
          predicates:
            - Path=/api/v1/cities/departments/**
            - Method=GET


        - id: user-auth-login
          uri: ${microservices.user.url}
          predicates:
            - Path=/api/v1/auth/login
            - Method=POST
        
        - id: user-create
          uri: ${microservices.user.url}
          predicates:
            - Path=/api/v1/user/create
            - Method=POST
        
        
        - id: appointmentslot-create
          uri: ${microservices.visit.url}
          predicates:
            - Path=/api/v1/appointmentslot/create
            - Method=POST
        
        - id: appointmentslot-read
          uri: ${microservices.visit.url}
          predicates:
            - Path=/api/v1/appointmentslot/read
            - Method=GET
        
        - id: visit-create
          uri: ${microservices.visit.url}
          predicates:
            - Path=/api/v1/visit/create
            - Method=POST

       
        - id: property-service
          uri: ${microservices.property.url}
          predicates:
            - Path=/property/**
          filters:
            - StripPrefix=1
        
        - id: user-service
          uri: ${microservices.user.url}
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        
        - id: visit-service
          uri: ${microservices.visit.url}
          predicates:
            - Path=/visit/**
          filters:
            - StripPrefix=1

        # Property Microservice API Docs
        - id: property-api-docs
          uri: ${microservices.property.url}
          predicates:
            - Path=/v3/api-docs/property
          filters:
            - RewritePath=/v3/api-docs/property, /v3/api-docs
        
        # User Microservice API Docs
        - id: user-api-docs
          uri: ${microservices.user.url}
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
        
        # Visit Microservice API Docs
        - id: visit-api-docs
          uri: ${microservices.visit.url}
          predicates:
            - Path=/v3/api-docs/visit
          filters:
            - RewritePath=/v3/api-docs/visit, /v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.web.reactive: WARN
    reactor.netty: WARN
    org.springframework.cloud.gateway.handler.predicate: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

